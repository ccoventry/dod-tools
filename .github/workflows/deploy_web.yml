# DISABLED 2026-08-24: this workflow builds the retired egui/WASM GUI via Trunk,
# targeting a `dod-tools-gui` binary that no longer exists post-Tauri-migration
# (merge 00e540d, 2026-08-18) — it would fail at the `trunk build` step if it ran.
# Switched to workflow_dispatch (manual-only) so it can't fire and fail silently.
# Delete this workflow (and native/index.html, its Trunk entry point) once you're
# sure GitHub Pages hosting isn't wanted for anything else; re-add the push
# trigger below if you rebuild it for something real.
name: Deploy Web App to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        run: |
          wget -qO- https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf-
          sudo mv trunk /usr/local/bin/

      - name: Build Web App
        run: |
          cd native
          # Ensures assets and WASM use paths relative to the GitHub Pages repository folder
          trunk build --release --public-url "/${{ github.event.repository.name }}/"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './native/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
