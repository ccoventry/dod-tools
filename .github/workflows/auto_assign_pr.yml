# Assigns the Assignee field to whoever opened the PR. GitHub does not set
# this automatically — Author and Assignee are separate fields — and an
# unassigned PR list is what prompted this (2026-08-29).
name: Auto-assign PR author

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Assign the PR to its author
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --add-assignee "${{ github.event.pull_request.user.login }}" --repo "${{ github.repository }}"
