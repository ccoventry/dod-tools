name: Release desktop-studio (Dev)

# Manual only, on demand — this is a separate, deliberately lower-friction
# channel for trying dev before it's promoted to main, not a build that fires
# on every push to dev (that would mean a full multi-platform Tauri build on
# every merge). See issue #133 and updater_manager.rs: this republishes a
# single fixed release (tag `dev-latest`) in place each run, since the app's
# "dev" update channel polls a fixed URL under that tag, not `/releases/latest`
# (which never resolves to a prerelease).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version this build is heading toward (e.g. 0.11.0 — no leading 'v'); the actual build gets '-dev.<short-sha>' appended so it always compares as newer than the last dev build and never collides with a stable release of the same number."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Delete previous dev-latest release and tag, if present
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete dev-latest --yes --cleanup-tag || true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop-studio/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop-studio
        run: npm ci

      # Same manual, not-committed-back version stamp as release_stable.yml,
      # plus a `-dev.<short-sha>` suffix — unique per run and always newer
      # than the plain version alone (semver pre-release identifiers sort
      # below the release they're attached to, so this only ever offers
      # itself as an update to someone already on an older dev build, never
      # to someone on the matching stable release).
      - name: Set dev build version
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DEV_VERSION="${RELEASE_VERSION}-dev.${SHORT_SHA}"
          node -e "
            const fs = require('fs');
            const version = process.env.DEV_VERSION;
            for (const path of ['desktop-studio/src-tauri/tauri.conf.json', 'desktop-studio/package.json']) {
              const json = JSON.parse(fs.readFileSync(path, 'utf8'));
              json.version = version;
              fs.writeFileSync(path, JSON.stringify(json, null, 2) + '\n');
            }
          "
          echo "DEV_VERSION=${DEV_VERSION}" >> "$GITHUB_ENV"

      - name: Build, sign, and publish dev build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop-studio
          tagName: dev-latest
          releaseName: "DoD Tools Studio ${{ env.DEV_VERSION }} (dev)"
          releaseBody: "On-demand dev build from `dev` — not for general use. Built from commit ${{ github.sha }}."
          releaseDraft: false
          prerelease: true
