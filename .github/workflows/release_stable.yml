name: Release desktop-studio (Stable)

# Manual only — cutting a stable release is a deliberate action taken after
# promoting dev to main, not something that fires on every push. See issue
# #133 and desktop-studio/src-tauri/src/updater_manager.rs: this workflow's
# GitHub Release is exactly what the app's "stable" update channel polls, via
# GitHub's `/releases/latest` alias (works because this release is neither a
# draft nor a prerelease).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.11.0 — no leading 'v')"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop-studio/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop-studio
        run: npm ci

      # Stamps this run's version into the two Tauri-side manifests. Not
      # committed back — the repo's checked-in version stays whatever it was;
      # only this build (and the release it produces) carries the bumped
      # number. There is no automated version-bump tooling in this repo yet,
      # so the version to release is a manual decision each time.
      - name: Set release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.RELEASE_VERSION;
            for (const path of ['desktop-studio/src-tauri/tauri.conf.json', 'desktop-studio/package.json']) {
              const json = JSON.parse(fs.readFileSync(path, 'utf8'));
              json.version = version;
              fs.writeFileSync(path, JSON.stringify(json, null, 2) + '\n');
            }
          "

      - name: Build, sign, and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop-studio
          tagName: v${{ github.event.inputs.version }}
          releaseName: "DoD Tools Studio v${{ github.event.inputs.version }}"
          releaseBody: "See assets below to download."
          releaseDraft: false
          prerelease: false
