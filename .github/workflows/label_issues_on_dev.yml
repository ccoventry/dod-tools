# `dev` isn't this repo's default branch (`main` is), so GitHub's own
# closing-keyword auto-close never fires when a fix merges into `dev` — and
# even once `dev` reaches `main`, an issue only auto-closes if a real
# closing keyword ("Fixes #NN"/"Closes #NN"/"Resolves #NN") was used
# somewhere, which this repo's actual convention (a bare "(#NN)" in the
# commit subject) doesn't satisfy either. Without this, a fixed issue just
# stays open indefinitely. See issue #64/#66/#78/#80/#82's discussion.
#
# This labels an issue `on-dev` the moment the PR that fixes it merges into
# `dev`, so a human can batch-close what's actually done. Two ways in:
#
#  1. GitHub's own Development-link data (closingIssuesReferences) — set by
#     a real closing keyword in the PR body/commits, or a manual link via
#     the PR's Development sidebar (how #66 got linked on PR #71). Native,
#     precise, zero heuristics: if GitHub says a PR closes an issue, it does.
#  2. Falling back to this PR's own commit subjects only when GitHub found
#     no native link, since today's actual convention doesn't produce one.
#     Deliberately scoped to subjects, not bodies: a bare "#NN" mention in a
#     commit *body* is routinely just a reference to related or still-open
#     work (e.g. "deferred to #84"), not a completion signal, and labeling
#     on that would mislabel it.
name: Label issues merged to dev

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  issues: write
  pull-requests: read

jobs:
  label:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Label issues fixed by this PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e

          numbers=$(gh pr view "$PR_NUMBER" --json closingIssuesReferences \
            -q '.closingIssuesReferences[].number')

          if [ -z "$numbers" ]; then
            echo "No native Development links on #$PR_NUMBER — falling back to commit subjects."
            numbers=$(gh pr view "$PR_NUMBER" --json commits \
              -q '.commits[].messageHeadline' \
              | grep -oE '\(#[0-9]+\)' \
              | tr -d '()#' \
              | sort -un)
          fi

          for n in $numbers; do
            # repos/{owner}/{repo}/issues/N returns PRs too (with a
            # non-null pull_request field) — skip those rather than
            # mislabeling a PR number that happened to match the pattern.
            info=$(gh api "repos/$REPO/issues/$n" \
              -q '.state + "|" + (.pull_request != null | tostring) + "|" + .title' 2>/dev/null) || continue
            state="${info%%|*}"
            rest="${info#*|}"
            is_pr="${rest%%|*}"
            subject="${rest#*|}"
            [ "$state" = "open" ] || continue
            [ "$is_pr" = "false" ] || continue
            case "$subject" in
              "[R&D]"*)
                echo "Skipping #$n (R&D tracker, needs a human judgment call): $subject"
                continue
                ;;
            esac
            echo "Labeling #$n as on-dev: $subject"
            gh issue edit "$n" --add-label "on-dev" --repo "$REPO"
          done
