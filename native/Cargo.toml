[package]
name = "native"
version.workspace = true
edition.workspace = true

[dependencies]
analysis = { path = "../analysis" }
clap = { workspace = true, features = ["derive"] }
dem = { workspace = true }
dod = { path = "../dod" }
filetime = { workspace = true }
humantime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
tabled = { workspace = true }
chrono = "0.4.45"
web-time = { workspace = true }
nom = { workspace = true }
log = "0.4"
dirs = "5.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "process", "fs", "sync", "io-util", "time"] }
walkdir = "2.5.0"
hl-demo-auditor = { path = "../hl-demo-auditor" }
rfd = "0.14"
open = "5.1"
sysinfo = "0.29"
keepawake = "0.6"

[[bin]]
name = "preview_cli"
path = "src/bin/cli/main.rs"

[[bin]]
name = "dod-tools-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "dod-tools-dump"
path = "src/bin/dump.rs"

[[bin]]
name = "dod-tools-inspect"
path = "src/bin/inspect.rs"

[[bin]]
name = "frame_inspector"
path = "src/bin/frame_inspector.rs"

[[bin]]
name = "inspect_reconnect"
path = "src/bin/inspect_reconnect.rs"

[[bin]]
name = "test_builder"
path = "src/bin/test_builder.rs"

[[bin]]
name = "check_ticks"
path = "src/bin/check_ticks.rs"


[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
console_error_panic_hook = "0.1.7"
js-sys = "0.3.77"
web-sys = { version = "0.3.77", features = ["HtmlCanvasElement", "Window", "Document", "Element", "File", "Storage", "Worker", "Blob", "Url", "DedicatedWorkerGlobalScope", "MessageEvent", "HtmlCollection", "NodeList"] }
