# Standalone crate: declares its own [workspace] so it does NOT join the
# dod-tools workspace and does not require editing the root Cargo.toml.
# Move it into `members` when you want it built by `cargo build --workspace`.
[workspace]

[package]
name = "xash-transcode"
version = "0.1.0"
edition = "2021"
description = "Transcode GoldSrc HLDEMO demos into the Xash3D IDEM container, with clip cutting"

[dependencies]
dem = { path = "../dem-patch" }
eyre = "0.6.12"
# Only used by the `pack` subcommand (binary side); the library stays dep-light
# and wasm-clean.
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
