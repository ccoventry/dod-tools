<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/src/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>Welcome to Tauri</h1>

      <div class="row">
        <button id="select-demo-btn">Select Source Demo</button>
      </div>
      <p id="selected-file-path" style="font-family: monospace; color: #00ff00;"></p>

      <div class="row">
        <button id="test-btn">Ping Native Rust Backend</button>
      </div>
      <p id="response-log"></p>

      <div class="row">
        <input type="text" id="scan-path-input" placeholder="Enter directory path..." style="flex: 1;" />
        <button id="add-folder-btn">Add Folder</button>
      </div>
      <ul id="folder-list"></ul>
      <div class="row">
        <button id="scan-dir-btn">Scan Directories</button>
      </div>
      <div id="export-config-panel" style="margin-top: 15px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px;">
        <h3>Export Configuration</h3>
        <div class="row">
          <label for="config-capture-fps">Capture FPS:</label>
          <input type="number" id="config-capture-fps" value="60" />
        </div>
        <div class="row">
          <label for="config-expected-fps">Expected FPS:</label>
          <input type="number" id="config-expected-fps" value="100" />
        </div>
        <div class="row">
          <label for="config-pre-roll">Pre-roll Seconds:</label>
          <input type="number" step="0.1" id="config-pre-roll" value="3.0" />
        </div>
        <div class="row">
          <label for="config-post-roll">Post-roll Seconds:</label>
          <input type="number" step="0.1" id="config-post-roll" value="2.0" />
        </div>
        <div class="row">
          <input type="checkbox" id="config-hide-non-pov" />
          <label for="config-hide-non-pov">Hide Non-POV</label>
        </div>
        <h4>Target Drives</h4>
        <div class="row">
          <input type="text" id="drive-path-input" placeholder="Enter output drive path..." style="flex: 1;" />
          <button id="add-drive-btn">Add Drive</button>
        </div>
        <ul id="target-drive-list"></ul>
        <div class="row">
          <label for="allocation-strategy">Allocation Strategy:</label>
          <select id="allocation-strategy">
            <option value="MaximizeSpace">Maximize Space</option>
            <option value="Chronological">Chronological</option>
          </select>
        </div>
      </div>
      <div id="demo-list-container"></div>

      <div class="row">
        <button id="start-batch-btn">Start Capture Batch</button>
        <button id="cancel-batch-btn" disabled>Cancel Batch</button>
      </div>
      <p id="batch-status">Status: Waiting...</p>

      <div id="render-studio-panel" style="margin-top: 30px; border-top: 2px solid #ccc; padding-top: 20px;">
        <h2>Render Studio</h2>
        <h4>Render Source Folders</h4>
        <div class="row">
          <input type="text" id="render-path-input" placeholder="Enter render directory path..." style="flex: 1;" />
          <button id="add-render-folder-btn">Add Render Folder</button>
        </div>
        <ul id="render-folder-list"></ul>
        <div class="row">
          <button id="scan-render-btn">Scan for Takes</button>
        </div>
        <div id="render-job-container" style="margin-top: 15px;"></div>
        <div class="row" style="margin-top: 15px;">
          <button id="start-render-btn">Start Render Batch</button>
          <button id="cancel-render-btn" disabled>Cancel Render</button>
        </div>
        <p id="render-status">Status: Waiting...</p>
      </div>
    </main>
  </body>
</html>
