[package]
name = "web-analyzer"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
analysis = { path = "../analysis" }
serde = { workspace = true }
serde-wasm-bindgen = "0.6.5"
# Pinned exactly: the deploy workflow installs a matching wasm-bindgen-cli
# version to post-process the .wasm build, and a mismatched CLI/crate pair
# fails at that step. Bump both together.
wasm-bindgen = "=0.2.126"
js-sys = "0.3.77"
console_error_panic_hook = "0.1.7"
